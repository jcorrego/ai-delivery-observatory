name: Reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: python examples/generate.py
      - run: python -m observatory html --data examples/synthetic.json --config examples/config.json --from 2026-01-01 --to 2026-09-30 --output docs/demo.html
      - run: git diff --exit-code -- examples docs/demo.html
