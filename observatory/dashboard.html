<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Delivery Observatory</title>
<style>
:root{font:15px/1.5 system-ui,-apple-system,sans-serif;color:#243436;background:#f4f6f4;--teal:#12695d;--gold:#b7732d;--line:#d7dfda;--muted:#5d706b}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:36px 28px 60px}header{display:flex;justify-content:space-between;align-items:start;gap:24px}.eyebrow{font:600 12px/1.5 system-ui;letter-spacing:.11em;text-transform:uppercase;color:var(--teal)}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.035em;margin:10px 0 12px;line-height:1.15}h2{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}h3{font-size:16px}p{margin:8px 0}small,.muted{color:var(--muted)}.badge{background:#e3efe9;border-radius:5px;padding:5px 10px;font-size:12px;white-space:nowrap}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:16px;margin:28px 0}label{font-size:12px;font-weight:600;color:var(--muted)}input,select,button{font:inherit}input,select{display:block;padding:9px 10px;border:1px solid #b8c9c0;border-radius:5px;background:white;color:#243436;max-width:100%}button,.button{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;min-height:40px;border:1px solid #8eaaa0;border-radius:5px;background:white;color:var(--teal);font-weight:600;cursor:pointer;text-decoration:none}button:hover,.button:hover{background:#eaf1ed}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79b9a9;outline-offset:2px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:white;border:1px solid var(--line);border-radius:10px}.card{padding:22px}.value{display:block;font-size:29px;font-weight:650;letter-spacing:-.04em;line-height:1.25;font-variant-numeric:tabular-nums;margin:5px 0}.card p{font-size:12px;color:var(--muted)}.panel{padding:26px;margin-top:22px}.panel-header{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:20px}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;margin:16px 0}.dot{width:10px;height:10px;display:inline-block;margin-right:6px;background:var(--teal);border-radius:2px}.dot.gold{background:var(--gold)}svg{width:100%;height:auto;display:block}.chart-wrap{overflow:auto}.chart-wrap svg{min-width:440px}.note{background:#f1f6f2;border-left:3px solid #8bb1a0;padding:12px 16px;font-size:13px;margin-top:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}td.numeric{text-align:right;font-variant-numeric:tabular-nums}td small{display:block}summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}summary:before{content:'+';margin-right:10px;color:var(--teal)}details[open]>summary:before{content:'−'}.actions{display:flex;justify-content:flex-end;margin:18px 0 14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.effort-input{width:90px}.status{font-size:12px;color:var(--muted)}footer{margin-top:28px;font-size:12px;color:var(--muted)}#alert{color:#923e22;min-height:24px}.review-actions{display:flex;gap:8px}.review-actions button{font-size:12px;min-height:34px;padding:6px 10px}.hidden{display:none}@media(max-width:760px){main{padding:24px 16px}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.panel{padding:18px}.panel-header,header{flex-direction:column}.actions{justify-content:flex-start}.split{grid-template-columns:1fr}h2{font-size:20px}}@media(max-width:420px){.cards{grid-template-columns:1fr 1fr;gap:10px}.value{font-size:23px}.filters label{flex:1 1 44%}.filters input,.filters select{width:100%}}@media print{body{background:white}main{padding:0}.filters,.actions,button,.review-actions,#review{display:none}.panel,.card{break-inside:avoid}.panel{border:0;padding:16px 0}.chart-wrap svg{min-width:0}}
</style></head><body><main>
<header><div><div class="eyebrow">AI Delivery Observatory</div><h1>Delivery and AI usage</h1><p class="muted" id="subtitle">Loading the report…</p></div><div class="badge" id="status">Admin report</div></header>
<form class="filters" id="filters"><label>Person<select id="person"><option value="">Whole team</option></select></label><label>Repository<select id="repository"><option value="">All repositories</option></select></label><label>From<input type="date" id="from" required></label><label>To<input type="date" id="to" required></label><button id="apply">Update report</button><button type="button" id="logout">Sign out</button></form>
<div id="alert" role="alert"></div><div id="content"></div>
<footer>Observed activity and approved estimates have different evidence requirements. Historical equivalence is a model under constant availability, not measured time saved. Public examples contain synthetic data only.</footer>
</main><script>
const EXPORT=/*BOOTSTRAP*/null;
let current=null,requestVersion=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null?'Unavailable':Number(v).toLocaleString(undefined,{maximumFractionDigits:1});
const fixed=v=>v==null?'Unavailable':Number(v).toFixed(2);
const card=(name,value,note)=>`<div class="card"><small>${esc(name)}</small><strong class="value">${esc(value)}</strong><p>${esc(note)}</p></div>`;
const table=(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||'<tr><td colspan="8">No records for this selection.</td></tr>'}</tbody></table></div>`;
function activityChart(rows){
 const w=1000,h=280,left=42,top=18,bottom=44,plot=h-top-bottom,max=Math.max(1,...rows.flatMap(r=>[r.merged,r.collaboration]));
 const step=(w-left-12)/Math.max(1,rows.length),bar=Math.min(38,step*.30);let svg='';
 for(let i=0;i<=4;i++){const y=top+plot-i*plot/4;svg+=`<line x1="${left}" x2="${w}" y1="${y}" y2="${y}" stroke="#e0e7e2"/><text x="${left-8}" y="${y+4}" text-anchor="end" fill="#5d706b" font-size="11">${fmt(max*i/4)}</text>`;}
 rows.forEach((r,i)=>{const x=left+step*(i+.5);[['merged','#12695d',-bar-2],['collaboration','#b7732d',2]].forEach(([key,color,offset])=>{const height=r[key]/max*plot;svg+=`<rect x="${x+offset}" y="${top+plot-height}" width="${bar}" height="${height}" rx="2" fill="${color}"><title>${esc(r.month)}: ${esc(key)} ${r[key]}</title></rect>`;});svg+=`<text x="${x}" y="${h-15}" text-anchor="middle" fill="#5d706b" font-size="11">${esc(r.month.slice(2))}</text>`;});
 return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Monthly merged human PRs and distinct collaboration PRs"><title>Monthly human activity, bots excluded</title>${svg}</svg>`;
}
function capacityChart(people){
 const rows=people.filter(p=>p.equivalent_days!=null),max=Math.max(1,...rows.map(p=>p.equivalent_days),current.period.working_days),h=Math.max(90,rows.length*56+38);let svg='';
 rows.forEach((p,i)=>{const y=i*56+20;svg+=`<text x="0" y="${y+4}" font-size="12" fill="#243436">${esc(p.name)}</text><rect x="180" y="${y-10}" width="${p.equivalent_days/max*630}" height="15" rx="2" fill="#12695d"/><text x="${188+p.equivalent_days/max*630}" y="${y+2}" font-size="11">${fmt(p.equivalent_days)} days</text><rect x="180" y="${y+10}" width="${current.period.working_days/max*630}" height="8" rx="2" fill="#b7732d"/>`;});
 return rows.length?`<svg viewBox="0 0 980 ${h}" role="img" aria-label="Historical equivalent working days compared with working days in the selected period">${svg}</svg>`:'<p class="muted">No comparable output has sufficient baseline and diff coverage in this selection.</p>';
}
function download(rows,name){
 const keys=Object.keys(rows[0]||{date:0,created:0,merged:0,collaboration:0,ai_reviews:0});
 const quote=value=>{let v=Array.isArray(value)?value.join(', '):String(value??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
 const blob=new Blob([keys.map(quote).join(',')+'\n'+rows.map(r=>keys.map(k=>quote(r[k])).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function render(r){
 current=r;const s=r.summary,b=r.baseline,usage=r.usage['github-copilot'],hours=s.approved_prs?`${fmt(s.effort_low_hours)}–${fmt(s.effort_high_hours)} h`:'Awaiting review';
 document.querySelector('#subtitle').textContent=`${r.organization} · ${r.period.from} to ${r.period.to} · ${r.period.working_days} working days`;
 document.querySelector('#status').textContent=r.synthetic?'Synthetic example':'Admin report';
 document.querySelector('#content').innerHTML=`<div class="cards">${card('Approved manual effort',hours,`${s.approved_prs} reviewed PRs. Pending and stale estimates are excluded.`)}${card('Recorded Copilot credits',fmt(usage?.credits),'Provider billing units, not a token count or an invoice.')}${card('Human PRs merged',fmt(s.merged),`${fmt(s.created)} created in this period.`)}${card('Collaboration PRs',fmt(s.collaboration),`${fmt(s.interaction_events)} human review, approval, comment, or merge events on other authors’ PRs.`)}</div>
 <section class="panel"><h2>Activity over time</h2><p class="muted">Human activity only. Bot-created PRs and bot interactions are excluded from this chart.</p><div class="legend"><span><i class="dot"></i>Merged PRs</span><span><i class="dot gold"></i>Distinct collaboration PRs</span></div><div class="chart-wrap">${activityChart(r.monthly)}</div><details><summary>Daily numbers</summary><div class="actions"><button id="daily-csv">Download daily CSV</button></div>${table(['Date','Created','Merged','Collaboration PRs','AI review cycles'],r.daily.map(d=>`<tr><td>${esc(d.date)}</td><td class="numeric">${d.created}</td><td class="numeric">${d.merged}</td><td class="numeric">${d.collaboration}</td><td class="numeric">${d.ai_reviews}</td></tr>`))}</details></section>
 <section class="panel"><h2>What this output historically takes</h2><p class="muted">${esc(b.label)}, ${esc(b.from)} to ${esc(b.to)}. Matched repository scope only.</p><div class="legend"><span><i class="dot"></i>Modeled historical working days</span><span><i class="dot gold"></i>Working days in this period</span></div><div class="chart-wrap">${capacityChart(r.people)}</div><div class="note">${fmt(s.historical_equivalent_hours)} modeled hours for the scored, comparable subset. Assumes ${r.assumptions.hours_per_day} hours per working day. This is output equivalence; PR merge dates do not establish when work began or active time spent.</div>${table(['Person','Merged','Weighted units','Reference','Equivalent days','Diff coverage'],r.people.map(p=>`<tr><td>${esc(p.name)}</td><td class="numeric">${p.merged}<small>${p.unmatched_prs} outside baseline scope</small></td><td class="numeric">${fmt(p.weighted_units)}</td><td>${esc(p.reference)}<small>${fixed(p.daily_reference_units)} units/day</small></td><td class="numeric">${fmt(p.equivalent_days)}</td><td class="numeric">${fmt(p.diff_coverage*100)}%</td></tr>`))}<details><summary>Baseline and sensitivity</summary><p>Team mean ${fixed(b.team_daily_units)} units/day; median ${fixed(b.team_median_daily_units)}; mean excluding the largest reference ${fixed(b.without_largest_daily_units)}. ${b.team_people} people included. Version ${esc(b.version)}.</p>${table(['Person','Sample','Complete months','Units/day','Eligible personal reference'],b.people.filter(p=>!r.filter.person||p.id===r.filter.person).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.merged_prs} merged; ${p.scored_prs} scored</td><td>${p.months}</td><td>${fixed(p.daily_units)}</td><td>${p.personal_eligible?'Yes':'No'}</td></tr>`))}</details></section>
 <section class="panel"><h2>AI-assisted review work</h2><p>${fmt(s.ai_reviews)} completed cycles; ${fmt(s.attributed_ai_reviews)} have supported person attribution. Zero-finding reviews still count as completed work.</p><p class="muted">Bot comments keep their original authorship. Sponsored AI review cycles are separate from human interaction counts and whole-PR effort.</p><details><summary>Review cycle details</summary>${table(['Date','PR','Sponsor','Comments','Suggestions','Applied'],r.ai_review_work.map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.pr)}</td><td>${esc(r.people.find(p=>p.id===c.person)?.name||'Unresolved')}</td><td>${fmt(c.comments)}</td><td>${fmt(c.suggestions)}</td><td>${fmt(c.applied_suggestions)}</td></tr>`))}</details></section>
 <section class="panel"><h2>AI usage evidence</h2>${table(['Provider','Observed days','Credits','Tokens','Prompts','Active review person-days','Passive review person-days'],Object.entries(r.usage).map(([provider,u])=>`<tr><td>${esc(provider)}</td><td>${u.observed_days}</td><td>${fmt(u.credits)}</td><td>${fmt(u.tokens)}</td><td>${fmt(u.prompts)}</td><td>${fmt(u.code_review_active)}</td><td>${fmt(u.code_review_passive)}</td></tr>`))}<p class="muted">Unavailable values remain unavailable. Provider totals can cover additional work beyond these PRs. Repository filters exclude ${r.quality.unallocated_usage_rows} usage rows without repository attribution.</p></section>
 <section class="panel"><h2>Automations and bots</h2><p class="muted">Grouped categories; each PR counts once per category and measure. With a person filter, this section covers bots on that person’s authored, participated, or sponsored PRs.</p><div class="actions"><button id="automation-csv">Download automation CSV</button></div>${table(['Category','Platforms','Created PRs','Interaction PRs'],r.automation.map(a=>`<tr><td>${esc(a.category)}</td><td>${esc(a.platforms.join(', '))}</td><td class="numeric">${a.created}</td><td class="numeric">${a.interacted}</td></tr>`))}</section>
 <section class="panel" id="review"><details><summary>Review effort estimates</summary><p class="muted">Whole-PR manual effort ranges, including implementation, testing, review, and integration. Review each PR; heuristic drafts do not enter approved totals. ${s.pending_effort} pending, ${s.stale_effort} stale.</p>${table(['PR','State','Low hours','High hours','Review'],r.effort_queue.map((p,i)=>`<tr data-effort="${i}"><td>${esc(p.title)}<small>${esc(p.pr)}</small></td><td>${esc(p.status)}</td><td><input aria-label="Low effort hours for ${esc(p.title)}" class="effort-input low" type="number" min="0" step="0.5" value="${p.low_hours??''}"></td><td><input aria-label="High effort hours for ${esc(p.title)}" class="effort-input high" type="number" min="0" step="0.5" value="${p.high_hours??''}"></td><td class="review-actions"><button data-state="approved" ${EXPORT?'disabled':''}>Approve</button><button data-state="rejected" ${EXPORT?'disabled':''}>Reject</button></td></tr>`))}</details></section>
 <section class="panel"><details id="private-cost"><summary>Private cost scenarios</summary><p class="muted">Optional modeled cost, separate from an employer’s actual pay rates. No financial ROI is calculated from incomplete provider coverage.</p><label>Scenario hourly rate, USD<input id="rate" type="number" min="0" value="50" step="5"></label><p id="cost"></p>${table(['Provider','Recorded USD cost'],Object.entries(r.usage).map(([provider,u])=>`<tr><td>${esc(provider)}</td><td>${fmt(u.cost_usd)}</td></tr>`))}</details></section>
 <section class="panel"><details><summary>Data quality and source coverage</summary><p>${r.quality.current_collection_complete?'Collection coverage is complete for this period.':'Collection coverage is partial or unavailable for this period.'} ${s.unlinked_merged_prs} merged PRs have unlinked authors and are excluded from personal capacity estimates.</p>${table(['Repository','From','To','Status'],r.quality.source_coverage.map(c=>`<tr><td>${esc(c.repository)}</td><td>${esc(c.from)}</td><td>${esc(c.to)}</td><td>${esc(c.status)}</td></tr>`))}<p>Unlinked accounts, for admin identification: ${esc(r.quality.unlinked_accounts.join(', ')||'None')}.</p><p>Report version ${esc(r.report_version)}. Size policy ${esc(r.assumptions.size_version)}. Approved effort rubric ${esc(r.assumptions.effort_rubric_version)}.</p></details></section>`;
 document.querySelector('#automation-csv').onclick=()=>download(r.automation,'automation-activity.csv');document.querySelector('#daily-csv').onclick=()=>download(r.daily,'daily-activity.csv');
 document.querySelector('#rate').oninput=()=>{const rate=Number(document.querySelector('#rate').value);document.querySelector('#cost').textContent=s.approved_prs?`Approved manual effort scenario: $${fmt(s.effort_low_hours*rate)} to $${fmt(s.effort_high_hours*rate)}. Modeled historical equivalent: $${fmt(s.historical_equivalent_hours==null?null:s.historical_equivalent_hours*rate)}.`:'Awaiting approved effort estimates; no manual-cost scenario is available yet.';};document.querySelector('#rate').oninput();
 document.querySelectorAll('[data-state]').forEach(button=>button.onclick=async()=>{const row=button.closest('tr'),p=r.effort_queue[Number(row.dataset.effort)],low=row.querySelector('.low'),high=row.querySelector('.high');if(!low.value||!high.value)return alertMessage('Enter both effort bounds before reviewing.');try{const response=await fetch('/api/effort',{method:'POST',headers:{'Content-Type':'application/json','X-Observatory-Action':'review'},body:JSON.stringify({pr:p.pr,revision:p.revision,status:button.dataset.state,low_hours:Number(low.value),high_hours:Number(high.value)})});const body=await response.json();if(!response.ok)throw Error(body.error);await load();}catch(e){alertMessage(e.message);}});
}
function alertMessage(message){document.querySelector('#alert').textContent=message;}
async function load(){
 const version=++requestVersion; alertMessage(EXPORT?'Static export: the period is fixed. Use the admin server for date and repository filters.':'');if(EXPORT){render(EXPORT.reports[document.querySelector('#person').value||'team']);return;}
 const query=new URLSearchParams();for(const key of ['person','from','to']){const value=document.querySelector('#'+key).value;if(value)query.set(key,value);}const repository=document.querySelector('#repository').value;if(repository)query.set('repository',repository);
 try{const response=await fetch('/api/report?'+query);if(response.status===401){location.reload();return;}const r=await response.json();if(version!==requestVersion)return;if(!response.ok)throw Error(r.error);if(!current){for(const p of r.options.people){const o=new Option(p.name,p.id);document.querySelector('#person').add(o);}for(const name of r.options.repositories)document.querySelector('#repository').add(new Option(name,name));document.querySelector('#from').value=r.period.from;document.querySelector('#to').value=r.period.to;}render(r);}catch(e){alertMessage(e.message);}
}
document.querySelector('#filters').onsubmit=e=>{e.preventDefault();load();};
document.querySelector('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',headers:{'Content-Type':'application/json','X-Observatory-Action':'logout'},body:'{}'});location.reload();};
if(EXPORT){for(const p of EXPORT.people)document.querySelector('#person').add(new Option(p.name,p.id));document.querySelector('#person').onchange=load;for(const key of ['from','to']){document.querySelector('#'+key).value=EXPORT.reports.team.period[key];document.querySelector('#'+key).disabled=true;}document.querySelector('#repository').disabled=true;document.querySelector('#apply').classList.add('hidden');document.querySelector('#logout').classList.add('hidden');alertMessage('Static export: the period is fixed. Use the admin server for date and repository filters.');}
load();
</script></body></html>
